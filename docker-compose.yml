services:
  # Kafka em modo KRaft: um nó só, sem ZooKeeper. Suficiente para o treinamento.
  kafka:
    image: apache/kafka:4.1.0
    container_name: stock-curve-kafka
    ports:
      - "19092:19092" # acesso a partir da sua máquina (kafka CLI, dotnet run local)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PROXY é o caminho do produtor: o Kafka anuncia "toxiproxy:29092" nesse
      # listener, então o cliente volta pelo proxy depois do metadata. Sem um
      # listener só para isso, o produtor pegaria "kafka:9092" no metadata e
      # falaria direto com o broker, passando por fora do Toxiproxy.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092,PROXY://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092,PROXY://toxiproxy:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PROXY:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "kafka:9092"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Cria os tópicos e encerra. b3.quotes tem 3 partições para dar para mostrar
  # que a chave (ticker) decide onde a mensagem cai; a DLQ tem 1, porque ali o
  # volume é (ou deveria ser) baixo e ninguém processa em paralelo.
  kafka-init:
    image: apache/kafka:4.1.0
    container_name: stock-curve-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists --topic b3.quotes --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists --topic b3.quotes.dlq --partitions 1 --replication-factor 1

  # Onde o contrato mora (módulo 3). Guarda os schemas no próprio Kafka, no
  # tópico interno _schemas — por isso ele depende do broker, e não de um banco.
  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    container_name: stock-curve-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      # 8081 é a porta canônica do Schema Registry. Se ela já estiver ocupada na
      # sua máquina: SR_PORT=18081 make up (e ajuste a URL nos comandos).
      - "${SR_PORT:-8081}:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      # BACKWARD já é o default; deixamos explícito porque é a decisão que
      # define quem faz deploy primeiro (consumidor) no resto do módulo.
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/subjects || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Interface web para olhar tópicos, partições e mensagens.
  #
  # Com o schema-registry configurado, o AKHQ para de mostrar bytes e passa a
  # desserializar o Avro: a aba Schema Registry lista os subjects e as versões,
  # e cada mensagem aparece com o id do schema que a escreveu.
  akhq:
    image: tchiotludo/akhq:0.26.0
    container_name: stock-curve-akhq
    depends_on:
      schema-registry:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            stock-curve:
              properties:
                bootstrap.servers: "kafka:9092"
              schema-registry:
                url: "http://schema-registry:8081"

  # Fica no meio do caminho produtor -> Kafka para a gente injetar latência de
  # rede. Em localhost o round-trip é ~0, e aí nenhuma configuração de batching
  # faz sentido; com 3 ms o laboratório passa a parecer um cluster de verdade.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    container_name: stock-curve-toxiproxy
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8474:8474" # API do Toxiproxy (dá para mexer na latência com o lab de pé)
    volumes:
      - ./perf/toxiproxy.json:/config/toxiproxy.json:ro
    command: ["-host=0.0.0.0", "-config", "/config/toxiproxy.json"]
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "-h", "http://localhost:8474", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  # O arquivo de config do Toxiproxy cria o proxy mas ignora toxics, então a
  # latência entra por aqui, pela API. DELETE antes do POST para o "make up"
  # poder rodar de novo sem dar erro de toxic duplicado.
  toxiproxy-init:
    image: curlimages/curl:8.11.1
    container_name: stock-curve-toxiproxy-init
    depends_on:
      toxiproxy:
        condition: service_healthy
    environment:
      LATENCY_MS: "${LATENCY_MS:-3}"
    entrypoint: ["sh", "-c"]
    command:
      - |
        curl -s -X DELETE http://toxiproxy:8474/proxies/kafka/toxics/net_latency > /dev/null 2>&1
        curl -sf -X POST http://toxiproxy:8474/proxies/kafka/toxics \
          -H 'Content-Type: application/json' \
          -d "{\"name\":\"net_latency\",\"type\":\"latency\",\"stream\":\"downstream\",\"attributes\":{\"latency\":$${LATENCY_MS},\"jitter\":0}}"
        echo ""
        echo "  latencia produtor -> kafka: $${LATENCY_MS}ms por ida-e-volta"

  producer:
    build:
      context: .
      dockerfile: src/StockCurve.Producer/Dockerfile
    container_name: stock-curve-producer
    depends_on:
      toxiproxy-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    ports:
      - "5001:8080"
    environment:
      Kafka__BootstrapServers: toxiproxy:29092
      Kafka__Topic: b3.quotes
      Kafka__EnableIdempotence: "true"
      Kafka__LingerMs: "5"
      Kafka__CompressionType: none
      # O produtor fala com o registry direto, por fora do Toxiproxy: a latência
      # injetada é instrumento do módulo 1 e só atrapalharia a leitura do schema.
      Kafka__SchemaRegistry__Url: http://schema-registry:8081
      # true para o lab subir sem passo manual. Em produção isto é false e quem
      # registra é o pipeline — "make schema-register".
      Kafka__SchemaRegistry__AutoRegisterSchemas: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # O consumidor do módulo 2: lê b3.quotes em at-least-once e mantém a curva de
  # preço de cada papel em memória, servida por uma API para o SPA desenhar.
  #
  # Repare que ele fala com "kafka:9092", e não com o Toxiproxy: a latência
  # injetada é um instrumento do módulo 1, para o batching do produtor aparecer.
  # Do lado do consumidor ela só atrapalharia a leitura da curva ao vivo.
  consumer:
    build:
      context: .
      dockerfile: src/StockCurve.Consumer/Dockerfile
    container_name: stock-curve-consumer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    ports:
      - "5002:8080"
    environment:
      Kafka__BootstrapServers: kafka:9092
      Kafka__Topic: b3.quotes
      Kafka__DeadLetterTopic: b3.quotes.dlq
      Kafka__GroupId: stock-curve-chart
      # earliest: um grupo novo nasce lendo tudo que ainda está na retenção, e
      # a curva já aparece cheia na primeira vez que o lab sobe.
      Kafka__AutoOffsetReset: earliest
      Kafka__HistorySize: "500"
      Kafka__SchemaRegistry__Url: http://schema-registry:8081
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # SPA em Vite servido por nginx, que também faz o proxy de /api para a API do
  # consumidor — o mesmo prefixo que o Vite usa em "npm run dev".
  web:
    build: ./web
    container_name: stock-curve-web
    depends_on:
      consumer:
        condition: service_healthy
    ports:
      - "5173:80"

  # Só roda sob demanda (make perf), por isso fica atrás de um profile.
  k6:
    image: grafana/k6:0.57.0
    container_name: stock-curve-k6
    profiles: ["perf"]
    depends_on:
      producer:
        condition: service_healthy
    volumes:
      - ./perf:/scripts
    environment:
      PRODUCER_URL: http://producer:8080
    entrypoint: ["k6", "run", "/scripts/produce.js"]

  # O passo de contrato do pipeline, em .NET. Só roda sob demanda, igual ao k6.
  #   make schemas
  #   make schema-check FILE=contracts/evolucoes/quote-v2-com-default.avsc
  #   make schema-register FILE=contracts/quote.avsc
  schema-tool:
    build:
      context: .
      dockerfile: src/StockCurve.SchemaTool/Dockerfile
    container_name: stock-curve-schema-tool
    profiles: ["tools"]
    depends_on:
      schema-registry:
        condition: service_healthy
    volumes:
      - ./contracts:/contracts:ro
    environment:
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      SUBJECT: b3.quotes-value
      BOOTSTRAP_SERVERS: kafka:9092
      TOPIC: b3.quotes

  # Gera o C# de contracts/quote.avsc com o avrogen (make contracts) -- o aluno
  # não precisa instalar o dotnet tool, ele já vem dentro da imagem. Só roda
  # sob demanda, atrás do profile "tools", igual ao schema-tool e ao k6.
  avrogen:
    build:
      context: .
      dockerfile: contracts/avrogen.Dockerfile
    container_name: stock-curve-avrogen
    profiles: ["tools"]
    volumes:
      - .:/work
