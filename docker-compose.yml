services:
  # Kafka em modo KRaft: um nó só, sem ZooKeeper. Suficiente para o treinamento.
  kafka:
    image: apache/kafka:4.1.0
    container_name: stock-curve-kafka
    ports:
      - "19092:19092" # acesso a partir da sua máquina (kafka CLI, dotnet run local)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PROXY é o caminho do produtor: o Kafka anuncia "toxiproxy:29092" nesse
      # listener, então o cliente volta pelo proxy depois do metadata. Sem um
      # listener só para isso, o produtor pegaria "kafka:9092" no metadata e
      # falaria direto com o broker, passando por fora do Toxiproxy.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092,PROXY://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092,PROXY://toxiproxy:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PROXY:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "kafka:9092"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Cria o tópico com 3 partições e encerra. Precisamos de mais de uma partição
  # para dar para mostrar que a chave (ticker) decide onde a mensagem cai.
  kafka-init:
    image: apache/kafka:4.1.0
    container_name: stock-curve-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
      --create --if-not-exists --topic b3.quotes --partitions 3 --replication-factor 1

  # Interface web para olhar tópicos, partições e mensagens.
  akhq:
    image: tchiotludo/akhq:0.26.0
    container_name: stock-curve-akhq
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            stock-curve:
              properties:
                bootstrap.servers: "kafka:9092"

  # Fica no meio do caminho produtor -> Kafka para a gente injetar latência de
  # rede. Em localhost o round-trip é ~0, e aí nenhuma configuração de batching
  # faz sentido; com 3 ms o laboratório passa a parecer um cluster de verdade.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    container_name: stock-curve-toxiproxy
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8474:8474" # API do Toxiproxy (dá para mexer na latência com o lab de pé)
    volumes:
      - ./perf/toxiproxy.json:/config/toxiproxy.json:ro
    command: ["-host=0.0.0.0", "-config", "/config/toxiproxy.json"]
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "-h", "http://localhost:8474", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  # O arquivo de config do Toxiproxy cria o proxy mas ignora toxics, então a
  # latência entra por aqui, pela API. DELETE antes do POST para o "make up"
  # poder rodar de novo sem dar erro de toxic duplicado.
  toxiproxy-init:
    image: curlimages/curl:8.11.1
    container_name: stock-curve-toxiproxy-init
    depends_on:
      toxiproxy:
        condition: service_healthy
    environment:
      LATENCY_MS: "${LATENCY_MS:-3}"
    entrypoint: ["sh", "-c"]
    command:
      - |
        curl -s -X DELETE http://toxiproxy:8474/proxies/kafka/toxics/net_latency > /dev/null 2>&1
        curl -sf -X POST http://toxiproxy:8474/proxies/kafka/toxics \
          -H 'Content-Type: application/json' \
          -d "{\"name\":\"net_latency\",\"type\":\"latency\",\"stream\":\"downstream\",\"attributes\":{\"latency\":$${LATENCY_MS},\"jitter\":0}}"
        echo ""
        echo "  latencia produtor -> kafka: $${LATENCY_MS}ms por ida-e-volta"

  producer:
    build: ./src/StockCurve.Producer
    container_name: stock-curve-producer
    depends_on:
      toxiproxy-init:
        condition: service_completed_successfully
    ports:
      - "5001:8080"
    environment:
      Kafka__BootstrapServers: toxiproxy:29092
      Kafka__Topic: b3.quotes
      Kafka__EnableIdempotence: "true"
      Kafka__LingerMs: "5"
      Kafka__CompressionType: none
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Só roda sob demanda (make perf), por isso fica atrás de um profile.
  k6:
    image: grafana/k6:0.57.0
    container_name: stock-curve-k6
    profiles: ["perf"]
    depends_on:
      producer:
        condition: service_healthy
    volumes:
      - ./perf:/scripts
    environment:
      PRODUCER_URL: http://producer:8080
    entrypoint: ["k6", "run", "/scripts/produce.js"]
